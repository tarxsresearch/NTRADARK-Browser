
name: Build TEQSASUS Browser APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q TEQSASUS_Browser_Kotlin_CoGo.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: TEQSASUSBrowser
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TEQSASUS-Browser-apk
          path: TEQSASUSBrowser/app/build/outputs/apk/debug/app-debug.apk
